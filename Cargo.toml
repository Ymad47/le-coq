[package]
name = "le-coq-backend"
version = "0.1.0"
edition = "2021"
description = "Geopolitical intelligence platform - Rust backend core"
license = "AGPL-3.0"

[[bin]]
name = "le-coq-backend"
path = "backend/src/main.rs"

[dependencies]
# Web framework
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json"] }
neo4rs = "0.7"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Geospatial
geo = "0.28"
geo-types = "0.7"

# Search client (Meilisearch)
meilisearch-sdk = "0.24"

[dev-dependencies]
mockall = "0.12"
