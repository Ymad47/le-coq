[package]
name = "le-coq-backend"
version = "0.1.0"
edition = "2021"
description = "Geopolitical intelligence platform - Rust backend core"
license = "AGPL-3.0"

[lib]
name = "le_coq_backend"
path = "backend/src/lib.rs"

[[bin]]
name = "le-coq-backend"
path = "backend/src/main.rs"

[dependencies]
# Web framework
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Python integration (PyO3) - ABI3 for Python 3.11+ compatibility
pyo3 = { version = "0.20", features = ["auto-initialize", "abi3-py311"] }

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
lazy_static = "1"

# Geospatial
geo = "0.28"
geo-types = "0.7"

[dev-dependencies]
mockall = "0.12"
