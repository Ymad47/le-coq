version: '3.8'

services:
  # PostgreSQL + PostGIS + pgvector
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: lecoq
      POSTGRES_PASSWORD: lecoq_dev_password
      POSTGRES_DB: lecoq
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lecoq"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend API (Rust)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      BIND_ADDRESS: 0.0.0.0:8000
      DATABASE_URL: postgresql://lecoq:lecoq_dev_password@postgres:5432/lecoq
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - ./backend/migrations:/app/migrations

  # Frontend (Svelte)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
