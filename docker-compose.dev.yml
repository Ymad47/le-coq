version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: le-coq-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: le_coq
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  le-coq-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: le-coq-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/le_coq
      BIND_ADDRESS: 0.0.0.0:8000
      LE_COQ_API_KEY: ${LE_COQ_API_KEY:?LE_COQ_API_KEY must be set (openssl rand -hex 32)}
      PYTHONPATH: /app
      LD_LIBRARY_PATH: /usr/lib/x86_64-linux-gnu
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./plugins:/app/plugins

volumes:
  postgres_data:
